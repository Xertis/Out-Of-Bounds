name: Sync res from VoxelCore

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Upstream commit SHA, tag or branch (empty = latest main)'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM_URL: https://github.com/MihailRis/voxelcore.git
  UPSTREAM_BRANCH: main
  FOLDER: res
  SNAP_BRANCH: upstream-snapshot
  IMPORT_BRANCH: upstream-import
  BASE_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream commit (shallow)
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          REF="${INPUT_REF:-$UPSTREAM_BRANCH}"
          git init -q /tmp/up
          git -C /tmp/up fetch -q --depth 1 "$UPSTREAM_URL" "$REF"
          SHA=$(git -C /tmp/up rev-parse FETCH_HEAD)
          git -C /tmp/up cat-file -e "$SHA:$FOLDER" \
            || { echo "::error::'$FOLDER' not found in $SHA"; exit 1; }
          echo "UPSTREAM_SHA=$SHA" >> "$GITHUB_ENV"
          echo "UPSTREAM_SHORT=${SHA:0:8}" >> "$GITHUB_ENV"

      - name: Update snapshot branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin "$SNAP_BRANCH" >/dev/null; then
            git checkout -q -B "$SNAP_BRANCH" "origin/$SNAP_BRANCH"
          else
            git checkout -q --orphan "$SNAP_BRANCH"
            git rm -rqf --ignore-unmatch .
          fi

          rm -rf "$FOLDER"
          git -C /tmp/up archive "$UPSTREAM_SHA" "$FOLDER" | tar -x

          # The base content pack is maintained by this repository, not upstream.
          rm -rf "$FOLDER/content/base"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -q -m "Snapshot of $FOLDER from VoxelCore @ $UPSTREAM_SHORT" \
                          -m "${UPSTREAM_URL%.git}/commit/$UPSTREAM_SHA"
            git push -q origin "$SNAP_BRANCH"
          fi
          echo "SNAP_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Decide head branch
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor "$SNAP_SHA" "origin/$BASE_BRANCH"; then
            echo "Already merged, nothing to do."
            echo "### Already up to date (\`$UPSTREAM_SHORT\`)" >> "$GITHUB_STEP_SUMMARY"
            echo "SKIP=true" >> "$GITHUB_ENV"
          elif git merge-base "origin/$BASE_BRANCH" "$SNAP_SHA" >/dev/null 2>&1; then
            echo "HEAD_BRANCH=$SNAP_BRANCH" >> "$GITHUB_ENV"
          else
            # First import: no common history yet, build the merge in a separate branch
            git checkout -q -B "$IMPORT_BRANCH" "origin/$BASE_BRANCH"
            git merge --allow-unrelated-histories --no-edit \
              -m "Import $FOLDER from VoxelCore @ $UPSTREAM_SHORT" "$SNAP_SHA"
            git push -q origin "HEAD:refs/heads/$IMPORT_BRANCH" --force
            echo "HEAD_BRANCH=$IMPORT_BRANCH" >> "$GITHUB_ENV"
          fi

      - name: Create or update PR
        if: env.SKIP != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE="Sync $FOLDER from VoxelCore @ $UPSTREAM_SHORT"
          cat > /tmp/body.md <<EOF
          Automated update of \`$FOLDER\` from ${UPSTREAM_URL%.git}

          Commit: ${UPSTREAM_URL%.git}/commit/$UPSTREAM_SHA

          **Merge with a merge commit. Do not squash or rebase**, otherwise
          the snapshot branch stops being a merge base and later PRs will conflict.
          EOF

          PR=$(gh pr list --head "$HEAD_BRANCH" --base "$BASE_BRANCH" --state open \
                 --json number -q '.[0].number')
          if [ -z "$PR" ]; then
            gh pr create --head "$HEAD_BRANCH" --base "$BASE_BRANCH" \
              --title "$TITLE" --body-file /tmp/body.md
          else
            gh pr edit "$PR" --title "$TITLE" --body-file /tmp/body.md
          fi
